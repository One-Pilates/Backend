server.port=${SERVER_PORT:8080}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/onepilates?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.show-sql=${JPA_SHOW_SQL:true}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.time_zone=${TIMEZONE:America/Sao_Paulo}



app.jwt.secret=${JWT_SECRET:default_secret}
app.jwt.expiration-ms=${JWT_EXPIRATION:86400000}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

app.rabbitmq.email-queue=${EMAIL_QUEUE:email.queue}
app.rabbitmq.exchange=${EMAIL_EXCHANGE:email.exchange}
app.rabbitmq.routing-key=${EMAIL_ROUTING_KEY:email.routingkey}
app.rabbitmq.ia-queue=${IA_QUEUE:ia.queue}
# pedidos da IA processados ao mesmo tempo (mínimo-máximo de consumidores)
app.rabbitmq.ia-concurrency=${IA_CONCURRENCY:2-4}

logging.level.org.springframework.amqp=${LOG_AMQP:INFO}
logging.level.org.hibernate.SQL=${LOG_SQL:INFO}
logging.level.org.hibernate.type.descriptor.sql=${LOG_SQL_TYPE:TRACE}


# Spring upload config
spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

# Dados do Administrador
app.admin.email=${USER_ADMIN_EMAIL}
app.admin.nome=${USER_ADMIN_NOME}
app.admin.cpf=${USER_ADMIN_CPF}

#IA
groq.api.key=${GROQ_API_KEY}
groq.model=${GROQ_MODEL:openai/gpt-oss-120b}
groq.whisper.model=${GROQ_WHISPER_MODEL:whisper-large-v3-turbo}
